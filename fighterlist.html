<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fantasy MMA - Fighter List</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <nav class="navbar">

        <div class="logo">
            Fantasy MMA
        </div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="leagues.html">Leagues</a></li>
            <li><a href="rankings.html">Rankings</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="myteam.html">My Team</a></li>
            <li><a href="fighterlist.html">Fighter List</a></li>
        </ul>

        <div class="auth-buttons">
            <button class="btn login">Login</button>
            <button class="btn signup">Sign Up</button>
        </div>

    </nav>
</header>

<main class="fighter-page">

    <h1>UFC Fighters</h1>

    <div class="fighter-filters">
        <input
            type="search"
            id="fighter-search"
            placeholder="Search fighters..."
            aria-label="Search fighters"
        >

        <select id="gender-filter" aria-label="Filter by gender">
            <option value="">All Genders</option>
        </select>

        <select id="weight-filter" aria-label="Filter by weight class">
            <option value="">All Weight Classes</option>
        </select>

        <button type="button" id="clear-filters">Clear Filters</button>
    </div>

    <p id="fighter-count" aria-live="polite"></p>

    <div class="fighter-table-wrapper">

        <table id="fighters-table">

            <thead>
                <tr>
                    <th
                        data-sort-key="name"
                        data-type="text"
                        tabindex="0"
                    >
                        Name
                        <span class="sort-indicator"></span>
                    </th>

                    <th
                        data-sort-key="age"
                        data-type="number"
                        tabindex="0"
                    >
                        Age
                        <span class="sort-indicator"></span>
                    </th>

                    <th
                        data-sort-key="gender"
                        data-type="text"
                        tabindex="0"
                    >
                        Gender
                        <span class="sort-indicator"></span>
                    </th>

                    <th
                        data-sort-key="weightClass"
                        data-type="text"
                        tabindex="0"
                    >
                        Weight Class
                        <span class="sort-indicator"></span>
                    </th>

                    <th
                        data-sort-key="elo"
                        data-type="number"
                        tabindex="0"
                    >
                        Current ELO
                        <span class="sort-indicator">▼</span>
                    </th>

                    <th>Last Fight</th>
                    <th>Next Fight</th>
                </tr>
            </thead>

            <tbody id="fighters-body"></tbody>

        </table>

    </div>

</main>

<script src="fighterlist.js"></script>

</body>
</html>
